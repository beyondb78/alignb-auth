<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>얼라인비 PC 인증 연결</title><style>body{font:18px system-ui;max-width:640px;margin:70px auto;padding:20px}button{padding:16px;font-size:18px}textarea{width:100%;height:110px}</style><h1>얼라인비 PC 프로그램 연결</h1><p id="msg"></p><button id="copy" hidden>인증 결과 복사</button><textarea id="fallback" hidden readonly aria-label="인증 결과"></textarea><p>복사한 결과는 PC 프로그램의 ‘② 인증 결과 붙여넣기’에 입력하세요. 채팅·이메일로 보내지 마세요. 연결 후 이 창을 닫으세요.</p><script>
const p=new URLSearchParams(location.search);history.replaceState(null,'',location.pathname);const code=p.get('code'),state=p.get('state');p.delete('code');p.delete('state');const data=JSON.stringify({code,state});if(code&&state){document.getElementById('msg').textContent='인증 결과가 도착했습니다.';const b=document.getElementById('copy');b.hidden=false;b.onclick=async()=>{try{await navigator.clipboard.writeText(data);b.textContent='복사 완료'}catch(e){const t=document.getElementById('fallback');t.hidden=false;t.value=data;t.select()}}}else document.getElementById('msg').textContent='PC 프로그램에서 인증을 먼저 시작하세요. 인증 오류가 있으면 카페24 앱의 주소와 권한을 확인하세요.';
</script></html>
