<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>얼라인비 PC 인증 연결</title>
<style>body{font:17px/1.7 system-ui,sans-serif;max-width:720px;margin:60px auto;padding:24px;color:#182332}h1{font-size:28px}button{padding:14px 22px;font-size:18px;background:#2456cf;color:white;border:0;border-radius:8px;cursor:pointer}textarea{box-sizing:border-box;width:100%;height:140px}#help{white-space:pre-line;background:#f1f4fa;padding:20px;border-radius:10px}small{color:#657084}[hidden]{display:none!important}</style>
</head>
<body>
<h1>얼라인비 PC 프로그램 연결</h1>
<h2 id="status">인증 결과 확인 중</h2>
<p id="help"></p>
<button id="copy" hidden>인증 결과 복사</button>
<textarea id="fallback" hidden readonly aria-label="인증 결과"></textarea>
<p id="notice"></p>
<small>인증페이지 v2 · 오류 구분 기능</small>
<script>
'use strict';
const params=new URLSearchParams(location.search);
const code=params.get('code'),state=params.get('state'),error=params.get('error');
try{history.replaceState(null,'',location.pathname);}catch(_){}
const status=document.getElementById('status'),help=document.getElementById('help'),notice=document.getElementById('notice'),copy=document.getElementById('copy');
const errors={
 invalid_scope:['요청한 API 권한이 일치하지 않습니다.','카페24 Developers에서 이 Client ID에 해당하는 앱의 권한관리를 확인하세요.\n프로그램 요청 권한: mall.read_product, mall.read_promotion, mall.write_promotion\n등록한 권한과 요청한 권한이 일치하도록 설정하고 저장한 뒤 PC 프로그램의 ① 카페24 인증 열기를 다시 누르세요.'],
 invalid_request:['앱 인증 설정을 확인해야 합니다.','PC 프로그램의 Client ID가 카페24에서 수정한 앱의 Client ID와 같은지 확인하세요.\n그 앱의 Redirect URI와 프로그램의 인증페이지 주소가 마지막 /까지 정확히 같아야 합니다.\nApp URL만 입력한 경우 Redirect URI도 별도로 등록하고 저장하세요.'],
 access_denied:['인증 요청이 거부되었습니다.','얼라인비 쇼핑몰의 대표 운영자 계정으로 로그인했는지 확인하세요. 승인을 취소했다면 PC 프로그램의 ① 버튼으로 다시 시작하세요.'],
 unsupported_response_type:['인증 요청 형식 오류입니다.','PC 프로그램에서 새로 인증을 시작하세요. 반복되면 이 오류 이름을 알려주세요.'],
 server_error:['카페24 인증 서버 오류입니다.','잠시 후 PC 프로그램의 ① 버튼으로 다시 인증하세요.'],
 temporarily_unavailable:['카페24 인증을 일시적으로 사용할 수 없습니다.','잠시 후 PC 프로그램의 ① 버튼으로 다시 인증하세요.']
};
if(error){
 const known=Object.prototype.hasOwnProperty.call(errors,error);
 status.textContent='인증 실패 · '+(known?error:'기타 오류');
 help.textContent=known?errors[error].join('\n\n'):'카페24에서 인증 오류가 반환되었습니다. 앱 설정과 대표 운영자 권한을 확인하세요.';
 notice.textContent='이 오류 안내 화면은 공유해도 됩니다. 인증코드와 Client Secret은 표시하지 않습니다.';
}else if(code&&state){
 status.textContent='인증 결과가 도착했습니다.';
 help.textContent='아래 버튼을 눌러 복사한 뒤, 즉시 PC 프로그램의 ② 인증 결과 붙여넣기에 입력하세요. 인증코드는 발급 후 1분이 지나면 만료됩니다.';
 notice.textContent='복사한 인증 결과는 채팅·이메일로 보내지 마세요. 이 화면을 새로고침하면 결과가 사라집니다.';
 copy.hidden=false;
 copy.onclick=async()=>{const data=JSON.stringify({code,state});try{await navigator.clipboard.writeText(data);copy.textContent='복사 완료 — PC 프로그램의 ②에 붙여넣으세요';}catch(_){const t=document.getElementById('fallback');t.hidden=false;t.value=data;t.select();notice.textContent='자동 복사가 지원되지 않습니다. 선택된 내용을 Ctrl+C로 복사하여 PC 프로그램의 ②에 붙여넣으세요. 채팅에는 보내지 마세요.';}};
}else if(code||state){
 status.textContent='인증 응답 일부가 누락되었습니다.';
 help.textContent='code 또는 state가 누락되어 안전하게 인증을 완료할 수 없습니다. PC 프로그램의 ① 카페24 인증 열기를 눌러 새 인증을 시작하세요.';
}else{
 status.textContent='인증 결과 없이 페이지가 열렸습니다.';
 help.textContent='GitHub 주소를 직접 열거나 카페24의 앱 실행 버튼을 누르면 이 화면이 나옵니다.\nPC 프로그램 AlignB.exe에서 ① 카페24 인증 열기를 누르세요.\n인증 결과가 도착했던 페이지를 새로고침한 경우에도 ①부터 다시 시작해야 합니다.';
 notice.textContent='① 버튼으로 시작해도 이 화면이 반복되면, 카페24 앱의 Client ID와 Redirect URI 설정을 확인하세요.';
}
</script>
</body>
</html>
